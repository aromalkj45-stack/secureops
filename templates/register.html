{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
<div class="card pad auth">
  <h1>Create account</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field"><label for="name">Full name</label><input id="name" name="name" required autofocus></div>
    <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required></div>
    <div class="field"><label for="password">Password (12+ characters)</label><input id="password" name="password" type="password" minlength="12" required></div>
    <button class="btn btn-primary btn-block btn-lg" type="submit">Create account</button>
  </form>
  <p class="muted center">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p>
</div>
{% endblock %}
